<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>METAMORPH</title>
<meta name="description" content="One game, seven forms. Tic-tac-toe that becomes Connect Four, Snake, Asteroids, Galaga, Breakout and Pong.">
<meta name="theme-color" content="#05030d">
<meta name="metamorph-build" content="20261012-203944">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metamorph">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05030d;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #pauseBtn {
    position: fixed; z-index: 5; top: calc(env(safe-area-inset-top) + 8px); right: calc(env(safe-area-inset-right) + 8px);
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(140,170,255,.25);
    background: rgba(10,8,30,.4); color: #aee; display: grid; place-items: center; padding: 0;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #pauseBtn::before, #pauseBtn::after { content: ""; position: absolute; width: 4px; height: 14px; border-radius: 2px; background: #9fd8ff; box-shadow: 0 0 8px #3ef2ff; }
  #pauseBtn::before { transform: translateX(-4px); } #pauseBtn::after { transform: translateX(4px); }
  body.title #pauseBtn { display: none; }
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 40%, rgba(30,10,60,.72), rgba(3,2,10,.9));
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff; text-align: center; transition: opacity .3s;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    margin: 0 0 8px; font-size: clamp(28px, 9.5vw, 44px); font-weight: 900; letter-spacing: 4px; white-space: nowrap;
    background: linear-gradient(90deg, #3ef2ff, #ff3bd4); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,59,212,.5));
  }
  .overlay button {
    min-width: 220px; padding: 14px 22px; border-radius: 16px; font: 800 15px/1 inherit; letter-spacing: 3px; color: #e6faff;
    background: rgba(62,242,255,.08); border: 1.5px solid rgba(62,242,255,.55); box-shadow: 0 0 18px rgba(62,242,255,.25), inset 0 0 12px rgba(62,242,255,.12);
  }
  .overlay button:active { transform: scale(.97); background: rgba(62,242,255,.2); }
  .overlay button.toggle { border-color: rgba(140,170,255,.3); box-shadow: none; color: #8b97c9; }
  .overlay button.toggle.on { border-color: rgba(77,255,154,.6); color: #cfffe3; box-shadow: 0 0 14px rgba(77,255,154,.2); }
  .overlay button.toggle::after { content: " · OFF"; }
  .overlay button.toggle.on::after { content: " · ON"; }
  .final { font: 900 54px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #fff; text-shadow: 0 0 20px #3ef2ff, 0 0 40px #3ef2ff; }
  .best { font-weight: 800; letter-spacing: 4px; color: #ffd84a; text-shadow: 0 0 12px rgba(255,216,74,.6); }
  .reached { color: #8b97c9; font-size: 13px; letter-spacing: 1px; max-width: 300px; margin-bottom: 18px; }
  #install {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 18px);
    color: #8b97c9; font-size: 12px; letter-spacing: 1px; text-align: center; width: 90%; pointer-events: none;
  }
  #install b { color: #cfe; }
  body:not(.title) #install { display: none; }
</style>
</head>
<body class="title">
<canvas id="gl"></canvas>
<div id="safe"></div>
<button id="pauseBtn" aria-label="Pause"></button>
<div id="install" hidden>Install: tap <b>Share</b> then <b>Add to Home Screen</b> for full-screen play</div>

<div id="menu" class="overlay hidden">
  <h1>PAUSED</h1>
  <button id="resume">RESUME</button>
  <button id="tMusic" class="toggle">MUSIC</button>
  <button id="tSfx" class="toggle">SOUND FX</button>
  <button id="tCrt" class="toggle">CRT MODE</button>
  <button id="restart">RESTART RUN</button>
</div>

<div id="over" class="overlay hidden">
  <h1>GAME OVER</h1>
  <div class="final">0</div>
  <div class="best"></div>
  <div class="reached"></div>
  <button id="again">PLAY AGAIN</button>
</div>

<script type="module" src="js/main.js"></script>
<script>
  // Show the install hint only in iOS Safari outside the installed app.
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.standalone) document.getElementById('install').hidden = false;
</script>
</body>
</html>
